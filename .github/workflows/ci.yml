name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpcre2-dev libpcre3-dev

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install --no-build-isolation -r requirements.txt
        pip install --upgrade "torch>=2.2.0" "transformers>=4.44.0" sentence-transformers pytest pytest-cov

    - name: Run Pytest Evaluation Suite
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_key' }}
        GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_key' }}
      run: |
        pytest
